# ================================================================
# Host Nginx Virtual Host Configuration for Zubaida Sarees
# Location on VPS: /etc/nginx/sites-available/zubaida_sarees.conf
# ================================================================

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain name(s)
    server_name zubaidasarees.com www.zubaidasarees.com;

    # Forward traffic to the Zubaida Sarees Docker container
    # Set the port below to match the PORT defined in your .env (default: 3060)
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;

        # Standard Reverse Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts and payload limits
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 35M;
    }

    # Custom Error Page when container is restarting
    error_page 502 503 504 /custom_50x.html;
    location = /custom_50x.html {
        return 503 "Zubaida Sarees service is starting up or temporarily updating. Please refresh in a moment.\n";
    }
}
