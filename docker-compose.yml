name: zubaida-sarees

services:
  # ==========================================
  # 1. PostgreSQL Database Service (Internal)
  # ==========================================
  zubaidasarees-db:
    image: postgres:16-alpine
    container_name: zubaidasarees-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zubaidasarees}
      POSTGRES_USER: ${POSTGRES_USER:-zubaida_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zubaida_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zubaida_admin} -d ${POSTGRES_DB:-zubaidasarees}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zubaidasarees-net
    # No host ports exposed to avoid conflict with other PostgreSQL instances on the VPS

  # ==========================================
  # 2. Node.js Express REST API Service (Internal)
  # ==========================================
  zubaidasarees-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zubaidasarees-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-kundanadmin2026}
      POSTGRES_HOST: zubaidasarees-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zubaidasarees}
      POSTGRES_USER: ${POSTGRES_USER:-zubaida_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zubaida_secure_pass_2026}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-d098e896b8f7dc0403ad3a16f592dfe6}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-f95b6dce449f4bb721ce54aa3b2f4e2b}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-401cb76e46f0f908fcd78b5b2fbd75e92a4bbc1d26adbffbb3c37ef14fcc2ca1}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-chf-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://pub-ce8688bc6c654bcfb99716f7c9373bcd.r2.dev}
    volumes:
      - uploads_data:/app/uploads
      - store_data:/app/data
    depends_on:
      zubaidasarees-db:
        condition: service_healthy
    networks:
      - zubaidasarees-net
    # No host ports exposed to avoid port conflict on the VPS

  # ==========================================
  # 3. Nginx Web & Reverse Proxy Service
  # ==========================================
  zubaidasarees-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zubaidasarees-web
    restart: unless-stopped
    ports:
      # Exposes ONLY this port to the VPS host.
      # Default: 3060. If 3060 is taken by another project, change PORT in .env
      - "${PORT:-3060}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - zubaidasarees-api
    labels:
      - "project=zubaidasarees"
    networks:
      - zubaidasarees-net

volumes:
  postgres_data:
    name: zubaidasarees_postgres_data
  uploads_data:
    name: zubaidasarees_uploads_data
  store_data:
    name: zubaidasarees_store_data

networks:
  zubaidasarees-net:
    name: zubaidasarees-net
    driver: bridge
